<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="needleN" x1="256" y1="78" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4ccff"/>
      <stop offset="100%" stop-color="#6b7aff"/>
    </linearGradient>
    <linearGradient id="needleS" x1="256" y1="256" x2="256" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9d5bd2"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#07091a"/>

  <!-- Outer bezel ring -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="#131730" stroke-width="28"/>

  <!-- Cardinal tick marks -->
  <rect x="248" y="42"  width="16" height="40" rx="8" fill="#6b7aff"/>
  <rect x="430" y="248" width="40" height="16" rx="8" fill="#3a4580"/>
  <rect x="248" y="430" width="16" height="40" rx="8" fill="#9d5bd2"/>
  <rect x="42"  y="248" width="40" height="16" rx="8" fill="#3a4580"/>

  <!-- Intercardinal tick marks (subtle) -->
  <rect x="370" y="116" width="10" height="28" rx="5" fill="#1e2450" transform="rotate(45 375 130)"/>
  <rect x="370" y="368" width="10" height="28" rx="5" fill="#1e2450" transform="rotate(-45 375 382)"/>
  <rect x="118" y="368" width="10" height="28" rx="5" fill="#1e2450" transform="rotate(45 123 382)"/>
  <rect x="118" y="116" width="10" height="28" rx="5" fill="#1e2450" transform="rotate(-45 123 130)"/>

  <!-- North needle — bold upward diamond -->
  <polygon points="256,80  237,258  256,238  275,258" fill="url(#needleN)"/>

  <!-- South needle — slimmer, muted -->
  <polygon points="256,432  275,254  256,274  237,254" fill="url(#needleS)" opacity="0.82"/>

  <!-- Center hub shadow -->
  <circle cx="256" cy="256" r="26" fill="#131730"/>
  <!-- Center hub -->
  <circle cx="256" cy="256" r="18" fill="#07091a" stroke="#6b7aff" stroke-width="3"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="7" fill="#a8b5ff"/>
</svg>
