<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="120" fill="#07091a"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#7c8fff" stroke-width="18"/>
  <circle cx="256" cy="256" r="12" fill="#7c8fff"/>
  <!-- North pointer -->
  <polygon points="256,80 240,250 272,250" fill="#a8b5ff"/>
  <!-- South pointer -->
  <polygon points="256,432 272,262 240,262" fill="#ff7aaa"/>
  <!-- E/W ticks -->
  <line x1="80" y1="256" x2="110" y2="256" stroke="#7c8fff" stroke-width="14" stroke-linecap="round"/>
  <line x1="432" y1="256" x2="402" y2="256" stroke="#7c8fff" stroke-width="14" stroke-linecap="round"/>
  <!-- Cardinal letters -->
  <text x="256" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="44" fill="#f0f3ff">N</text>
  <text x="256" y="476" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="44" fill="#b06aed">S</text>
  <text x="454" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="40" fill="#7c8fff">E</text>
  <text x="58" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="40" fill="#7c8fff">W</text>
</svg>
